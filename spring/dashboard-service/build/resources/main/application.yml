spring:
  application:
    name: dashboard-service
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/study_nest}
    username: ${DB_USER:lms}
    password: ${DB_PASSWORD:lms}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB     # Excel import (assumed)
      max-request-size: 5MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:lms}

server:
  port: ${PORT:8081}

lms:
  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:lms}
    app-client-id: ${KEYCLOAK_APP_CLIENT_ID:lms-web}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:dashboard-service}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me}
  services:
    classroom-base-url: ${CLASSROOM_SERVICE_URL:http://localhost:8082}
    processing-base-url: ${PROCESSING_SERVICE_URL:http://localhost:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.client.lms: INFO
